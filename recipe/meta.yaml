{% set name = "dadi" %}
{% set version = "2.4.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a402c21df6e7a1883be2bb566b9bbcfca334286582a4fd430f716ab3393861fe

build:
  number: 0
  script:
    # The sdist ships Cython-generated .c files built against the newest numpy;
    # delete them so they are regenerated against the numpy used for this build.
    - {{ PYTHON }} -c "import pathlib; [p.with_suffix('.c').unlink(missing_ok=True) for p in pathlib.Path('dadi').rglob('*.pyx')]"
    - {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
  host:
    - pip
    - setuptools
    - cython
    - python
    - numpy
    - nlopt
  run:
    - python
    - "numpy"
    - scipy
    - matplotlib-base
    - nlopt
    - demes

test:
  imports:
    - dadi
    - dadi.DFE
    - dadi.Triallele
    - dadi.TwoLocus
    - dadi.Polyploidy

about:
  home: https://github.com/RyanGutenkunst/dadi
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Fit population genetic models using diffusion approximations to the allele frequency spectrum
  doc_url: https://dadi.readthedocs.io/

extra:
  recipe-maintainers:
    - tjstruck
    - RyanGutenkunst
